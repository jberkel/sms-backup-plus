apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.zegoggles.smssync'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.zegoggles.smssync'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1602
        versionName '1.6.0-BETA2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProperties.isEmpty() ? null : signingConfigs.release
        }
    }

    lint {
        warningsAsErrors true
    }

    //  avoid "Duplicate files copied in APK META-INF/"
    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.jberkel.k-9:k9mail-library:eaf689025e'
    implementation 'com.android.billingclient:billing:4.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core-role:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation "com.google.truth:truth:1.1.5"
    testImplementation 'org.mockito:mockito-core:4.11.0'

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.1.1'
}

tasks.withType(JavaCompile) {
    if (!it.name.toLowerCase().contains('test')) {
        options.compilerArgs = ['-Werror', '-Xlint:unchecked', '-Xlint:deprecation']
    }
}
