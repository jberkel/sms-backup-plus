apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'sms.backup.plus'
    compileSdk 35
    defaultConfig {
        applicationId 'sms.backup.plus'
        minSdk 21
        targetSdk 35
        versionCode 1609
        versionName '1.6.0-BETA9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig keystoreProperties['storePassword'] ? signingConfigs.release : null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only let Gradle sign when a password is provided; otherwise produce an
            // unsigned artifact to be signed externally (e.g. apksigner/jarsigner).
            signingConfig keystoreProperties['storePassword'] ? signingConfigs.release : null
        }
    }

    lint {
        warningsAsErrors true
    }

    //  avoid "Duplicate files copied in APK META-INF/"
    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/DEPENDENCIES']
        }
    }

    buildFeatures {
        // AGP 8 no longer generates BuildConfig by default; the app uses BuildConfig.DEBUG.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }

    testOptions {
        unitTests {
            // Robolectric (4.4+) reads the merged binary resources
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'com.squareup:otto:1.3.8'
    implementation 'com.github.jberkel.k-9:k9mail-library:eaf689025e'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'androidx.core:core-role:1.0.0-beta01'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation "com.google.truth:truth:0.39"
    testImplementation 'org.mockito:mockito-all:1.10.17'
    testImplementation 'androidx.work:work-testing:2.8.1'

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.0-rc4'
}

tasks.withType(JavaCompile).configureEach {
    // configureEach (lazy) so this wins over the encoding AGP sets on its compile tasks
    options.encoding = 'UTF-8'
    if (!it.name.toLowerCase().contains('test')) {
        // -Xlint:deprecation is intentionally omitted: compiling against newer SDKs flags
        // framework APIs (AsyncTask, Service.stopForeground(boolean), ...) whose migration is
        // out of scope here. -Werror is kept for unchecked warnings.
        options.compilerArgs = ['-Xlint:unchecked']
    }
}

// Google Play Publisher (https://github.com/Triple-T/gradle-play-publisher).
// Store listing + screenshots live under src/main/play (generated from metadata/play).
play {
    // The service-account JSON path is read from the gitignored keystore.properties
    // (key: playCredentials), so the secret's location is never committed.
    def playCreds = keystoreProperties['playCredentials']
    if (playCreds) {
        serviceAccountCredentials.set(rootProject.file(playCreds))
    }
    // Track defaults to 'internal'; override per-invocation with -PplayTrack=alpha (closed
    // testing), -PplayTrack=beta (open testing), or -PplayTrack=production.
    track.set(project.findProperty('playTrack') ?: 'internal')
    defaultToAppBundles.set(true)
    // Release status defaults to 'completed'; override with -PplayReleaseStatus=draft. A Play
    // app that has never had a first production release ("draft app") only accepts draft releases.
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.valueOf(
        (project.findProperty('playReleaseStatus') ?: 'completed').toString().toUpperCase()))
    // Safety: only commit to Play when explicitly asked with -PplayCommit. Otherwise the
    // publish tasks validate and upload to a Play "edit" but never commit it (dry run).
    commit.set(project.hasProperty('playCommit'))
}